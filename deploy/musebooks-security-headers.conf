# Installed by remote-deploy-musebooks.sh at
# /etc/nginx/snippets/musebooks-security-headers.conf, matching MuseCards.
# Included in the musebooks.my HTTPS server block and again in every location
# that sets its own add_header (nginx drops inherited add_header directives in
# such a location).
#
# HSTS omits includeSubDomains so no subdomain can be locked out.
# Framing is same-origin, not DENY: the website embeds /hilltop-banner.html in
# an iframe. The CSP only sets directives that cannot break the ad and
# analytics scripts: no foreign framing, no <base> hijacking, no plugins.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Content-Security-Policy "frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;
