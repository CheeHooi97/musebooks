# Install after the Let's Encrypt certificate for both hostnames exists.
server {
    listen 80;
    listen [::]:80;
    server_name musebooks.my www.musebooks.my;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://musebooks.my$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.musebooks.my;

    ssl_certificate /etc/letsencrypt/live/musebooks.my/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/musebooks.my/privkey.pem;

    return 301 https://musebooks.my$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name musebooks.my;

    ssl_certificate /etc/letsencrypt/live/musebooks.my/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/musebooks.my/privkey.pem;

    root /var/www/musebooks/current;
    index index.html;

    location = /v1 {
        return 308 /v1/;
    }

    location ^~ /v1/ {
        proxy_pass http://127.0.0.1:2002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~ ^/(books/[^/]+|models(?:/[^/]+)?|publishers(?:/[^/]+)?|active|sold|about|privacy-policy)/+$ {
        return 301 /$1$is_args$args;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    location / {
        try_files $uri/index.html $uri =404;
    }
}
