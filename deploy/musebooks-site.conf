# Install after the Let's Encrypt certificate for both hostnames exists.

# Agent access, matching MuseCards. Every indexable page has a markdown twin
# beside it (/books/x -> /books/x.md, / -> /index.md). A client that lists
# text/markdown first in Accept ("text/markdown, text/html;q=0.9") receives
# the twin at the page URL; browsers never list it, so they keep getting HTML.
map $http_accept $musebooks_wants_markdown {
    default 0;
    "~*^\s*text/(x-)?markdown" 1;
}
# try_files checks decoded paths ($uri); a missing twin falls through to HTML.
map "$musebooks_wants_markdown$uri" $musebooks_negotiated {
    default "/.no-markdown-twin";
    "~^1/$" "/index.md";
    "~^1(?<musebooks_doc>/[^.]+)$" "$musebooks_doc.md";
}
# Headers advertise the encoded public URL, so they use $request_uri.
map $request_uri $musebooks_request_path {
    "~^(?<musebooks_path>[^?]*)" $musebooks_path;
}
map $musebooks_request_path $musebooks_document_links {
    default "";
    "/" "<https://musebooks.my/index.md>; rel=\"alternate\"; type=\"text/markdown\", <https://musebooks.my/.well-known/api-catalog>; rel=\"api-catalog\", <https://musebooks.my/llms.txt>; rel=\"describedby\"; type=\"text/plain\", <https://musebooks.my/sitemap.xml>; rel=\"sitemap\"; type=\"application/xml\"";
    "~^(?<musebooks_page>/[^.]+)$" "<https://musebooks.my$musebooks_page.md>; rel=\"alternate\"; type=\"text/markdown\", <https://musebooks.my/.well-known/api-catalog>; rel=\"api-catalog\", <https://musebooks.my/llms.txt>; rel=\"describedby\"; type=\"text/plain\", <https://musebooks.my/sitemap.xml>; rel=\"sitemap\"; type=\"application/xml\"";
}
map $musebooks_document_links $musebooks_vary {
    default "Accept";
    "" "";
}
map $musebooks_request_path $musebooks_markdown_canonical {
    default "";
    "/index.md" "<https://musebooks.my/>; rel=\"canonical\"";
    "~^(?<musebooks_md>/.+)\.md$" "<https://musebooks.my$musebooks_md>; rel=\"canonical\"";
}

server {
    listen 80;
    listen [::]:80;
    server_name musebooks.my www.musebooks.my;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://musebooks.my$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.musebooks.my;

    ssl_certificate /etc/letsencrypt/live/musebooks.my/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/musebooks.my/privkey.pem;

    return 301 https://musebooks.my$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name musebooks.my;

    ssl_certificate /etc/letsencrypt/live/musebooks.my/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/musebooks.my/privkey.pem;

    root /var/www/musebooks/current;
    index index.html;

    # Real visitor addresses behind Cloudflare, and security headers. Every
    # location below that sets its own add_header includes the headers again.
    include /etc/nginx/snippets/musebooks-cloudflare-real-ip.conf;
    include /etc/nginx/snippets/musebooks-security-headers.conf;

    include /etc/nginx/mime.types;
    types {
        text/markdown md;
    }
    charset utf-8;
    charset_types text/markdown text/plain text/xml application/json;

    location = /v1 {
        return 308 /v1/;
    }

    location ^~ /v1/ {
        proxy_pass http://127.0.0.1:2002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        # Never spill responses to /var/lib/nginx/proxy: on the shared server
        # that directory is not writable by the workers, and large catalog
        # pages were cut off for slower clients. Hold reads in memory instead.
        proxy_buffers 32 16k;
        proxy_max_temp_file_size 0;
    }

    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/musebooks-security-headers.conf;
        access_log off;
    }

    location ~ ^/((?:(?:jp|tw|cn|kr)/)?(?:books(?:/[^/]+)?|models(?:/[^/]+)?|publishers(?:/[^/]+)?)|jp|tw|cn|kr|active|sold|japan|about|privacy-policy)/+$ {
        return 301 /$1$is_args$args;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Machine-readable files for search engines and AI agents.
    location ~ ^/(robots\.txt|sitemap\.xml|llms\.txt|llms-full\.txt|openapi\.json)$ {
        add_header Cache-Control "public, max-age=3600, stale-if-error=86400";
        add_header Access-Control-Allow-Origin "*";
        include /etc/nginx/snippets/musebooks-security-headers.conf;
        try_files $uri =404;
    }

    location = /feed.xml {
        types { }
        default_type application/atom+xml;
        add_header Cache-Control "public, max-age=3600, stale-if-error=86400";
        include /etc/nginx/snippets/musebooks-security-headers.conf;
        try_files $uri =404;
    }

    # RFC 9727 API catalog.
    location = /.well-known/api-catalog {
        types { }
        default_type 'application/linkset+json; profile="https://www.rfc-editor.org/info/rfc9727"';
        add_header Cache-Control "public, max-age=3600";
        add_header Access-Control-Allow-Origin "*";
        include /etc/nginx/snippets/musebooks-security-headers.conf;
        try_files $uri =404;
    }

    location ~ \.md$ {
        add_header Link $musebooks_markdown_canonical;
        add_header Cache-Control "public, max-age=3600, stale-while-revalidate=86400, stale-if-error=86400";
        include /etc/nginx/snippets/musebooks-security-headers.conf;
        try_files $uri =404;
    }

    location / {
        # Documents answer the same URL as HTML or markdown, so caches key on Accept.
        add_header Vary $musebooks_vary;
        add_header Link $musebooks_document_links;
        # Like MuseCards: the edge may serve a stale copy while it refetches or
        # while the origin errors. Pages are static releases, never per-user.
        add_header Cache-Control "public, max-age=60, stale-while-revalidate=86400, stale-if-error=86400";
        include /etc/nginx/snippets/musebooks-security-headers.conf;
        try_files $musebooks_negotiated $uri/index.html $uri =404;
    }
}
