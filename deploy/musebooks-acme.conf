# Temporary HTTP-only site used to issue the first Let's Encrypt certificate.
server {
    listen 80;
    listen [::]:80;
    server_name musebooks.my www.musebooks.my;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
