# Installed by remote-deploy-musebooks.sh at
# /etc/nginx/snippets/musebooks-cloudflare-real-ip.conf and included in the
# musebooks.my HTTPS server block (server level, so it cannot clash with an
# http-level copy installed for MuseCards on the same server).
#
# musebooks.my is proxied by Cloudflare, so without this $remote_addr is a
# Cloudflare edge address. Many visitors share one edge address, and the API
# rate limiters, which key on X-Real-IP $remote_addr, would throttle them
# together.
#
# nginx takes CF-Connecting-IP only when the TCP peer is inside one of these
# ranges. A client that reaches the origin directly cannot claim another
# address with the header: its own address stays $remote_addr.
#
# Ranges from https://api.cloudflare.com/client/v4/ips (same list as MuseCards,
# checked 2026-10-19). Re-check with: node deploy/check-cloudflare-ranges.mjs

# IPv4
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;

# IPv6
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;

real_ip_header CF-Connecting-IP;
